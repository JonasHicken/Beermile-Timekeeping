[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: every real route (/event/:id/setup, /heat/:id/review, …)
# is rendered by React Router, so any path that isn't a file on disk has to be
# served the app shell. Without this, refreshing mid-race — or opening a deep
# link — returns a 404 from Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Content-hashed build output never changes in place, so cache it hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be served stale, or clients can pin themselves
# to an old build and stop receiving updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
