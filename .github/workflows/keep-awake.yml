# Keeps the shared-race database awake and tidy.
#
# Supabase pauses a free project after a week without use, and a paused
# database means a failed race-day sign-in. Every third day this calls
# tk_rydd(), which is real work, not just a ping: it deletes races that are
# more than three months old (their runners' names with them).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TIMING_SUPABASE_URL  the project's URL
#   TIMING_SUPABASE_KEY  its publishable key (sb_publishable_...)
# Without them (a fork, say) the job does nothing.
name: Keep database awake

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tidy and wake the database
        env:
          URL: ${{ secrets.TIMING_SUPABASE_URL }}
          KEY: ${{ secrets.TIMING_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "No database secrets set: nothing to do."
            exit 0
          fi
          code=$(curl -sS -o reply.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/tk_rydd" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' --retry 3 --retry-delay 20)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "The database did not answer as expected."
            exit 1
          fi
          echo "Expired races removed: $(grep -o '"slettet":[0-9]*' reply.json | cut -d: -f2)"
